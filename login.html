<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CAM Holdings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Inherit background from styles.css (Dark Luxury) */
        }
        .login-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 18px 70px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 400px;
            color: var(--fg);
        }
        .login-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            font-family: "Warband Stencil", "Batchan", sans-serif;
            letter-spacing: 0.06em;
            color: var(--gold2);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.72);
        }
        .form-group input {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.28);
            color: rgba(255, 255, 255, 0.92);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--gold);
        }
        .login-btn {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(180deg, rgba(214, 178, 94, 0.26), rgba(214, 178, 94, 0.10));
            border: 1px solid rgba(214, 178, 94, 0.42);
            color: white;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            transition: all 0.2s ease;
            font-family: "Batchan", sans-serif;
        }
        .login-btn:hover {
            border-color: rgba(214, 178, 94, 0.62);
            background: rgba(214, 178, 94, 0.15);
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .back-link:hover {
            color: var(--gold2);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Admin Portal</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="message" class="message"></div>
        </form>
        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.textContent = 'Logging in...';
            messageDiv.style.color = 'var(--gold2)';

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token); // Save token for React app
                    messageDiv.style.color = '#4ade80'; // Green
                    messageDiv.textContent = 'Login successful!';
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    messageDiv.style.color = '#ef4444'; // Red
                    messageDiv.textContent = data.message || 'Login failed';
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.style.color = '#ef4444';
                messageDiv.textContent = 'An error occurred. Check backend connection.';
            }
        });
    </script>
</body>
</html>
