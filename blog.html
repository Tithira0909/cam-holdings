<!doctype html>

<head>

  <title>Blog Details | CAM Holdings</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Specific styles for single blog page */
    .blog-hero {
      position: relative;
      height: 60vh;
      min-height: 400px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
    }
    .blog-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #0a0a0a, transparent);
    }
    .blog-hero-content {
      position: relative;
      z-index: 1;
      padding: 4rem 2rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
    }
    .blog-meta {
      display: flex;
      justify-content: center;
      gap: 1rem;
      font-size: 0.9rem;
      color: #d6b25e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }
    .blog-title {
      font-size: 3rem;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .blog-body {
      max-width: 800px;
      margin: 0 auto;
      padding: 4rem 2rem;
      color: #ccc;
      line-height: 1.8;
      font-size: 1.1rem;
    }
    .blog-body h2, .blog-body h3 {
      color: #fff;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    .blog-body p {
      margin-bottom: 1.5rem;
    }
    .blog-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 2rem 0;
    }
    .blog-nav {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .back-btn {
      color: #d6b25e;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-btn:hover {
      text-decoration: underline;
    }

    @media(max-width: 768px) {
        .blog-title { font-size: 2rem; }
    }
  </style>
</head>
